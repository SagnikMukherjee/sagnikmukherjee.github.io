<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<title>{{title}} — Sagnik Mukherjee</title>
<meta name="description" content="{{summary}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{summary}}">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<script>
  (function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    d.dataset.theme = t;
    if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#16181c';
  })();
</script>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="site-title" href="/">Sagnik Mukherjee</a>
    <nav>
      <a href="/blog/" aria-current="page">Blog</a>
      <a href="/data/cv.pdf" target="_blank" rel="noopener">CV</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch between day and night">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.6M19.4 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <article class="post">
    <h1>{{title}}</h1>
    <p class="post-meta"><time datetime="{{date_iso}}">{{date}}</time> · {{reading_time}} min read · <a href="/blog/">all posts</a></p>
    <div class="post-body">
{{content}}
    </div>
  </article>
</main>

<footer class="wrap"><div class="inner">© 2026 Sagnik Mukherjee</div></footer>

<script src="/site.js" defer></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});"></script>
</body>
</html>
