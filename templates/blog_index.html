<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"></noscript>
<link rel="stylesheet" href="/style.css">
<script>
  (function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    d.dataset.theme = t;
    if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#000000';
    d.classList.add('js');
    // stagger the entrance as soon as the HTML is parsed — never wait on art.js
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.reveal').forEach(function (el, i) { el.style.setProperty('--i', i); });
      d.classList.add('ready');
    });
  })();
</script>
<title>Writing — Sagnik Mukherjee</title>
<meta name="description" content="Writing by Sagnik Mukherjee.">
</head>
<body class="post-page">

<div id="scene" aria-hidden="true"><canvas id="paper"></canvas></div>

<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch between day and night">
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.6M19.4 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
</button>

<main id="app">
  <div class="site post">
    <div class="post-top reveal">
      <a class="back" href="/">← Sagnik Mukherjee</a>
    </div>
    <nav class="list">
      <h3 class="reveal">Writing</h3>
{{posts}}
    </nav>
  </div>
</main>

<script src="/art.js" defer></script>
</body>
</html>
